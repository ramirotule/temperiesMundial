services:
  # 1. Backend API (Node.js + Express + Prisma)
  - type: web
    name: temperies-mundial-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: temperies-mundial-db
          property: connectionString
      - key: PORT
        value: 3001

  # 2. Frontend React (Vite + Tailwind CSS v4)
  - type: web
    name: temperies-mundial-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://temperies-mundial-backend.onrender.com

databases:
  # 3. PostgreSQL Database
  - name: temperies-mundial-db
    plan: free
    postgresMajorVersion: 15
