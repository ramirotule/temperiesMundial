<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="celestial" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <!-- Background circle with Argentine colors -->
  <circle cx="50" cy="50" r="48" fill="url(#celestial)" stroke="#0f172a" stroke-width="1.5" />
  
  <!-- Soccer ball pattern behind the trophy slightly translucent -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#0f172a" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.4" />

  <!-- Gold Trophy Icon in the center -->
  <path d="M35,30 L65,30 L60,55 C58,62 52,65 50,65 C48,65 42,62 40,55 Z" fill="url(#gold)" stroke="#78350f" stroke-width="2" />
  <path d="M50,65 L50,80" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" />
  <path d="M32,80 L68,80" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" />
  <!-- Handles -->
  <path d="M35,35 C28,35 25,42 25,48 C25,54 30,55 35,55" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" />
  <path d="M65,35 C72,35 75,42 75,48 C75,54 70,55 65,55" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" />
  <!-- Sparkles -->
  <path d="M28,22 L30,25 L33,26 L30,27 L28,30 L26,27 L23,26 L26,25 Z" fill="#ffffff" />
  <path d="M72,22 L74,25 L77,26 L74,27 L72,30 L70,27 L67,26 L70,25 Z" fill="#ffffff" />
</svg>
